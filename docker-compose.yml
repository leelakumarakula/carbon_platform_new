# Local stack (spec section 50). Not exercised on the original dev machine (Docker not installed there);
# see README "Running without Docker" for the native setup that was verified.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#   docker compose exec backend python manage.py setup
#   docker compose exec backend python manage.py bootstrap-admin
name: carbon-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?set SQL_SERVER_PASSWORD in .env}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]   # local only: never publish an unauthenticated broker

  # Phase 12B: MinIO with SSE-S3 (KMS single-key mode: development only). The application never uses the root user.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  # One-shot: private versioned buckets per environment, SSE-S3 default encryption, application identity without delete,
  # separate deletion identity (docker/minio-init.sh).
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    env_file: .env
    environment:
      MINIO_URL: http://minio:9000
    volumes: ["./docker/minio-init.sh:/init/minio-init.sh:ro"]
    depends_on: [minio]

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USERNAME: sa
      SQL_SERVER_DRIVER: ODBC Driver 18 for SQL Server
      SQL_SERVER_TRUSTED_CONNECTION: "false"
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  # Phase 12A: same image as the API. SQL Server is the job record; Redis only transports job ids.
  worker:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    command: celery -A app.workers.celery_app:celery_app worker -Q default,maintenance -l info --concurrency 2
    env_file: .env
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USERNAME: sa
      SQL_SERVER_DRIVER: ODBC Driver 18 for SQL Server
      SQL_SERVER_TRUSTED_CONNECTION: "false"
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

  beat:   # exactly ONE beat per environment (duplicate slots are still harmless: per-slot idempotency keys)
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    command: celery -A app.workers.celery_app:celery_app beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USERNAME: sa
      SQL_SERVER_DRIVER: ODBC Driver 18 for SQL Server
      SQL_SERVER_TRUSTED_CONNECTION: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_started }

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["4200:80"]

volumes:
  sqldata:
  miniodata:
