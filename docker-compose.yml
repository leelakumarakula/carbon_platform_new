# Local stack (spec section 50). Not exercised on the original dev machine (Docker not installed there);
# see README "Running without Docker" for the native setup that was verified.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#   docker compose exec backend python manage.py setup
#   docker compose exec backend python manage.py bootstrap-admin
name: carbon-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?set SQL_SERVER_PASSWORD in .env}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USERNAME: sa
      SQL_SERVER_DRIVER: ODBC Driver 18 for SQL Server
      SQL_SERVER_TRUSTED_CONNECTION: "false"
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["4200:80"]

volumes:
  sqldata:
  miniodata:
